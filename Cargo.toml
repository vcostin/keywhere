[workspace]
resolver = "2"
members = ["crates/keywhere-core", "crates/keywhere-app"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.4"

# gpui 0.2.2 -> zed-async-tar -> xattr 0.2.3 references libc::ENOATTR, removed for Linux in
# newer libc. Patched copy; drop once gpui ships a newer dependency chain.
# gpui 0.2.2 ends the Linux and Windows event loop when the last window
# closes; Keywhere hides to the tray by closing its window, so that is
# patched out (marked "Keywhere patch" in wayland/client.rs, x11/client.rs
# and windows/platform.rs). Other
# "Keywhere patch" changes: taffy/line-layout cache clearing (no secret text
# left in memory) and a window icon (`set_window_icon`: Wayland
# xdg-toplevel-icon-v1 generated from a vendored XML, X11 _NET_WM_ICON).
[patch.crates-io]
xattr = { path = "third_party/xattr" }
gpui = { path = "third_party/gpui" }

# Pull-request checks (`--profile ci`): our app code builds fast (no
# optimisation, no debug info), while dependencies and the crypto engine are
# optimised so the key-stretching and tamper tests stay quick.
[profile.ci]
inherits = "dev"
debug = false
incremental = false

[profile.ci.package."*"]
opt-level = 2

[profile.ci.package.keywhere-core]
opt-level = 2
