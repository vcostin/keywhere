[workspace]
resolver = "2"
members = ["crates/keywhere-core", "crates/keywhere-app"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

# gpui 0.2.2 -> zed-async-tar -> xattr 0.2.3 references libc::ENOATTR, removed for Linux in
# newer libc. Patched copy; drop once gpui ships a newer dependency chain.
# gpui 0.2.2 ends the Linux event loop when the last window closes; Keywhere
# hides to the tray by closing its window, so that is patched out (2 lines,
# marked "Keywhere patch" in wayland/client.rs and x11/client.rs).
[patch.crates-io]
xattr = { path = "third_party/xattr" }
gpui = { path = "third_party/gpui" }
