# Supply-chain policy (cargo-deny). Run: cargo deny check
[graph]
all-features = false

[advisories]
# Vulnerabilities always fail. "unmaintained" notices (all transitive via
# gpui today) are reviewed by hand when gpui is bumped.
unmaintained = "none"
yanked = "deny"

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
    "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "MPL-2.0", "BSL-1.0",
    "CC0-1.0", "0BSD", "Unlicense", "NCSA",
]
# Mozilla's CA list (data, permissive), used by the updater's HTTPS client.
exceptions = [
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
]

[bans]
# gpui pulls many duplicate (non-secret) crates; only crypto crates are pinned to one version below.
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
# One version of each crate that touches Keywhere's secrets.
#
# sha2 is the exception, and it can't be avoided today: gpui 0.2.2 ->
# gpui_util -> rust-embed -> rust-embed-utils 8.14 needs sha2 0.11 to hash
# the bundled UI assets (fonts, icons; nothing secret). Every Keywhere crate
# (keywhere-core's key stretching, HMAC and v2 code, the app's clipboard and
# update checks) uses 0.10, as do hmac 0.12 and gpui's own users. The
# `wrappers` rule below makes that a check, not a promise: anything other
# than rust-embed-utils depending on sha2 0.11 fails `cargo deny check`.
# Drop the rule and pin sha2 like the others once gpui moves to one version.
deny = [
    { crate = "sha2@0.11", wrappers = ["rust-embed-utils"] },
    { crate = "hmac", deny-multiple-versions = true },
    { crate = "zeroize", deny-multiple-versions = true },
    { crate = "subtle", deny-multiple-versions = true },
    { crate = "twofish", deny-multiple-versions = true },
    { crate = "blowfish", deny-multiple-versions = true },
    { crate = "cbc", deny-multiple-versions = true },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
