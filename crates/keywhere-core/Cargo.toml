[package]
name = "keywhere-core"
description = "Password Safe v3 (.psafe3) vault engine for Keywhere"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
twofish = "0.7"
cbc = "0.1"
sha2 = "0.10"
hmac = "0.12"
subtle = "2"
zeroize = { version = "1", features = ["derive"] }
getrandom = "0.2"
thiserror = "1"
