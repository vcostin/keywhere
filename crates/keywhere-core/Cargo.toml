[package]
name = "keywhere-core"
description = "Password Safe v3 (.psafe3) vault engine for Keywhere"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true

[dependencies]
twofish = "0.7"
cbc = "0.1"
blowfish = "0.9"
byteorder = "1"
sha1 = { version = "0.10", features = ["compress"] }
sha2 = "0.10"
hmac = "0.12"
subtle = "2"
zeroize = { version = "1", features = ["derive"] }
getrandom = "0.2"
thiserror = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# `cargo fuzz` builds with `--cfg fuzzing` (see fuzz/README.md).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }
