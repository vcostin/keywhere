[package]
name = "keywhere"
description = "Keywhere — a modern Password Safe (.psafe3) compatible password manager"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true

[features]
# Dev tooling only (pre-unlocked screenshot harness). Never enable for releases.
devtools = []

[[example]]
name = "screenshot_demo"
required-features = ["devtools"]

[[example]]
name = "memtest_unlock"
required-features = ["devtools"]

[dependencies]
keywhere-core = { path = "../keywhere-core" }
gpui = "=0.2.2"
zeroize = "1"
sha2 = "0.10"
futures = "0.3"
url = "2.5"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
minisign-verify = "0.3.0"
semver = "1.0.28"
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
resvg = { version = "0.45", default-features = false }
getrandom = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
# Same versions as gpui 0.2.2 (system libwayland backend) for xdg-activation.
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.31", features = ["client", "staging"] }
raw-window-handle = "0.6"

[target.'cfg(not(target_os = "linux"))'.dependencies]
arboard = { version = "3.7", default-features = false }
