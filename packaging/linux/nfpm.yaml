# .deb and .rpm from the release binary (packaging/linux/build-packages.sh).
name: keywhere
arch: amd64
platform: linux
version: ${KEYWHERE_VERSION}
release: 1
section: utils
priority: optional
maintainer: Keywhere project <vcostin@users.noreply.github.com>
homepage: https://github.com/vcostin/keywhere
license: MIT
description: |
  Password Safe v3 compatible password manager.
  Keywhere opens .psafe3 vaults from Password Safe and Password Gorilla,
  with auto-lock, clipboard clearing and a tray icon.

contents:
  - src: target/release/keywhere
    dst: /usr/bin/keywhere
    file_info: { mode: 0755 }
  - src: packaging/linux/keywhere.desktop
    dst: /usr/share/applications/keywhere.desktop
  - src: packaging/linux/keywhere-mime.xml
    dst: /usr/share/mime/packages/keywhere.xml
  - src: assets/keywhere-key.svg
    dst: /usr/share/icons/hicolor/scalable/apps/keywhere.svg
  - src: LICENSE
    dst: /usr/share/doc/keywhere/LICENSE

overrides:
  deb:
    depends: [libc6 (>= 2.35), libxcb1, libxkbcommon0, libxkbcommon-x11-0, libvulkan1]
    recommends: [libwayland-client0, shared-mime-info, desktop-file-utils]
  rpm:
    # Library sonames, so the same .rpm resolves on Fedora and openSUSE
    # (their package names differ).
    depends:
      - libxcb.so.1()(64bit)
      - libxkbcommon.so.0()(64bit)
      - libxkbcommon-x11.so.0()(64bit)
      - libvulkan.so.1()(64bit)
    recommends:
      - libwayland-client.so.0()(64bit)
      - shared-mime-info
      - desktop-file-utils
