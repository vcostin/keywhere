name: Fuzz

# A short, time-boxed fuzz run on pull requests that change the vault engine
# or the fuzz targets. Longer runs are done by hand (fuzz/README.md).
on:
  pull_request:
    paths:
      - "crates/keywhere-core/**"
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"
  workflow_dispatch:

concurrency:
  group: fuzz-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The prebuilt cargo-fuzz is a musl binary and would default to the musl
# target; fuzz the normal glibc build.
env:
  TARGET: x86_64-unknown-linux-gnu

jobs:
  fuzz:
    name: fuzz (60 s per target)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Build targets
        working-directory: fuzz
        run: cargo +nightly fuzz build --target "$TARGET"
      - name: Run targets
        working-directory: fuzz
        run: |
          for t in $(cargo +nightly fuzz list); do
            echo "::group::$t"
            mkdir -p "corpus/$t"
            cargo +nightly fuzz run --target "$TARGET" "$t" "corpus/$t" "seeds/$t" -- \
              -max_total_time=60 -rss_limit_mb=2048
            echo "::endgroup::"
          done
      - name: Keep crashing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
