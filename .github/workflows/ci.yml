name: CI

# Checks for pull requests (main only changes through PRs, so a second run
# after merging adds nothing). Release builds run from release.yml on tags.
on:
  pull_request:
  workflow_dispatch:

# A new push to the same PR cancels its run in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fast correctness checks for every PR, on Linux. The heavier work (macOS
  # and Windows builds, packaging, install tests) runs in release.yml before
  # a release is published.
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # Same compiler as rust-toolchain.toml (bump both together).
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt
      # Same key as cache-warm.yml, so a new PR starts from main's cache.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci

      - name: Formatting
        run: cargo fmt --all --check
      - name: Core tests
        run: cargo test --locked --profile ci -p keywhere-core
      - name: Core lints
        run: cargo clippy --locked --profile ci -p keywhere-core --all-targets -- -D warnings

      - name: Linux GPUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libfontconfig-dev \
            libfreetype-dev libvulkan-dev libzstd-dev libasound2-dev clang
      - name: App tests
        run: cargo test --locked --profile ci -p keywhere
      - name: App lints
        run: cargo clippy --locked --profile ci -p keywhere --all-targets --features devtools -- -D warnings

  supply-chain:
    name: supply chain (audit, deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      # Fails on vulnerabilities; "unmaintained"/"unsound" warnings (all
      # transitive via gpui today) are reported but don't fail the build.
      - name: cargo audit
        run: cargo audit
      # crates.io only, license allowlist, one version of each crypto crate.
      # Runs even if audit failed, so both reports are always visible.
      - name: cargo deny
        if: success() || failure()
        run: cargo deny --locked check
