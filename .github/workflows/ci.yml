name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # One machine per OS. Steps run in order and stop at the first failure,
  # so the app is never built when the core engine's tests or lints fail.
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # Same compiler as rust-toolchain.toml (bump both together).
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Core tests
        run: cargo test --locked --release -p keywhere-core
      - name: Core lints
        run: cargo clippy --locked --release -p keywhere-core --all-targets -- -D warnings

      - name: Linux GPUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libfontconfig-dev \
            libfreetype-dev libvulkan-dev libzstd-dev libasound2-dev clang
      - name: App tests
        run: cargo test --locked --release -p keywhere
      - name: App lints
        run: cargo clippy --locked --release -p keywhere --all-targets --features devtools -- -D warnings

  supply-chain:
    name: supply chain (audit, deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      # Fails on vulnerabilities; "unmaintained"/"unsound" warnings (all
      # transitive via gpui today) are reported but don't fail the build.
      - name: cargo audit
        run: cargo audit
      # crates.io only, license allowlist, one version of each crypto crate.
      # Runs even if audit failed, so both reports are always visible.
      - name: cargo deny
        if: success() || failure()
        run: cargo deny --locked check
