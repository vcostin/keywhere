name: Preview packages

# Build the unsigned macOS and Windows preview packages without releasing,
# for testing on real machines or VMs. Runs on PRs that change the packaging
# scripts or the platform glue (crates/keywhere-app/src/sys), and by hand
# from the Actions tab for any branch. It also runs the app's tests and
# lints there, so macOS/Windows-only code is checked before merging.
on:
  pull_request:
    paths:
      - "packaging/macos/**"
      - "packaging/windows/**"
      - "crates/keywhere-app/examples/render_icon.rs"
      # macOS/Windows glue that the Linux PR checks don't compile.
      - "crates/keywhere-app/src/sys/**"
      - "crates/keywhere-app/Cargo.toml"
      - "crates/keywhere-app/build.rs"
      - ".github/workflows/preview.yml"
  workflow_dispatch:

concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: preview (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: App tests
        run: cargo test --locked --release -p keywhere
      # Same lints as release.yml's platform jobs, so macOS/Windows-only
      # warnings fail the PR instead of the release.
      - name: App lints
        run: cargo clippy --locked --release -p keywhere --all-targets --features devtools -- -D warnings
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          rustup target add x86_64-apple-darwin
          packaging/macos/build-app.sh aarch64-apple-darwin
          packaging/macos/build-app.sh x86_64-apple-darwin
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          packaging/windows/build-exe.ps1
          packaging/windows/build-installers.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: preview-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.app.zip
            dist/*-portable.exe
            dist/*-setup.exe
            dist/*.msi
          if-no-files-found: error
