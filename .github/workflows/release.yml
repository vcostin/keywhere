name: Release

# Push a tag `vX.Y.Z` matching the workspace version to publish a release:
# the Linux AppImage, .deb and .rpm (one machine, one binary), a signed `latest.json` for the in-app updater, and
# SHA256SUMS. See docs/releasing.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Full release-mode tests on the platforms PR checks skip. Nothing is
  # published unless these pass.
  platforms:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Core tests
        run: cargo test --locked --release -p keywhere-core
      - name: Core lints
        run: cargo clippy --locked --release -p keywhere-core --all-targets -- -D warnings
      - name: App tests
        run: cargo test --locked --release -p keywhere
      - name: App lints
        run: cargo clippy --locked --release -p keywhere --all-targets --features devtools -- -D warnings
      # Unsigned preview packages (see docs/releasing.md). Best effort: a
      # packaging failure leaves them out of the release instead of
      # blocking the Linux packages (the tests above still gate it).
      - name: Preview package (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          rustup target add x86_64-apple-darwin
          packaging/macos/build-app.sh aarch64-apple-darwin
          packaging/macos/build-app.sh x86_64-apple-darwin
      - name: Preview package (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          packaging/windows/build-exe.ps1
          packaging/windows/build-installers.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: preview-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.app.zip
            dist/*-portable.exe
            dist/*-setup.exe
            dist/*.msi
          if-no-files-found: warn

  linux:
    needs: platforms
    name: Linux (AppImage, .deb, .rpm)
    # Oldest supported glibc: build on the oldest maintained runner.
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy

      - name: Linux GPUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libfontconfig-dev \
            libfreetype-dev libvulkan-dev libzstd-dev libasound2-dev clang libfuse2 \
            xvfb xdotool xclip mesa-vulkan-drivers dbus

      - name: Tag matches the workspace version
        id: version
        run: |
          set -euo pipefail
          V=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="keywhere"))')
          if [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the workspace version $V"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Tests
        run: cargo test --locked --release --workspace
      - name: Lints
        run: cargo clippy --locked --release --workspace --all-targets --features keywhere/devtools -- -D warnings

      - name: Build AppImage
        run: packaging/linux/build-appimage.sh

      - name: End-to-end test of the AppImage
        run: |
          cargo build --locked --release -p keywhere-core --example e2e_vault
          tools/e2e/run.sh "dist/Keywhere-${{ steps.version.outputs.version }}-x86_64.AppImage" \
            target/release/examples/e2e_vault

      - name: Build .deb and .rpm
        run: packaging/linux/build-packages.sh

      - name: Install test (.deb on Ubuntu 22.04, .rpm on Fedora and openSUSE)
        run: |
          set -euo pipefail
          V=${{ steps.version.outputs.version }}
          sudo apt-get install -y "./dist/keywhere_${V}-1_amd64.deb"
          /usr/bin/keywhere --version | grep "^Keywhere $V "
          RPM="/dist/keywhere-${V}-1.x86_64.rpm"
          docker run --rm -v "$PWD/dist:/dist:ro" fedora:latest sh -c \
            "dnf install -y -q $RPM && keywhere --version | grep '^Keywhere $V '"
          # The .rpm is not GPG-signed (integrity comes from SHA256SUMS).
          docker run --rm -v "$PWD/dist:/dist:ro" opensuse/tumbleweed sh -c \
            "zypper -n --quiet install --allow-unsigned-rpm $RPM && keywhere --version | grep '^Keywhere $V '"

      - name: macOS and Windows preview packages
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: preview-*
          path: dist
          merge-multiple: true

      - name: Update manifest
        run: packaging/make-update-manifest.sh "${{ steps.version.outputs.version }}"

      - name: Install rsign2
        run: cargo install --locked rsign2 --version 0.6.7

      - name: Sign the update manifest
        env:
          KEYWHERE_UPDATE_KEY: ${{ secrets.KEYWHERE_UPDATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${KEYWHERE_UPDATE_KEY:-}" ]; then
            echo "::error::Repository secret KEYWHERE_UPDATE_KEY (minisign secret key) is missing. See docs/releasing.md."
            exit 1
          fi
          umask 077
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$KEYWHERE_UPDATE_KEY" > "$key"
          rsign sign -W -s "$key" -x dist/latest.json.minisig \
            -t "keywhere ${{ steps.version.outputs.version }}" dist/latest.json
          # The app only trusts the committed public key: prove this
          # signature verifies with it before anything is published.
          rsign verify -p packaging/keywhere-update.pub -x dist/latest.json.minisig dist/latest.json

      - name: Checksums
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd dist
          previews=(Keywhere-*.dmg Keywhere-*.app.zip Keywhere-*-portable.exe Keywhere-*-setup.exe Keywhere-*.msi)
          [ ${#previews[@]} -eq 7 ] || echo "::warning::${#previews[@]} of 7 macOS/Windows preview files built"
          sha256sum Keywhere-*.AppImage keywhere_*.deb keywhere-*.rpm "${previews[@]}" \
            latest.json latest.json.minisig > SHA256SUMS
          cat SHA256SUMS

      - name: Release notes
        run: packaging/release-notes.sh "$GITHUB_REF_NAME" | tee dist/NOTES.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Mark it latest only if it is the highest version released so
          # far: the updater reads releases/latest/download/latest.json, and
          # publishing an older patch must not hide a newer release.
          highest=$( { gh release list --repo "$GITHUB_REPOSITORY" --limit 200 \
                         --json tagName --jq '.[].tagName'; echo "$GITHUB_REF_NAME"; } \
                     | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          latest=false
          [ "$highest" = "$GITHUB_REF_NAME" ] && latest=true
          V=${{ steps.version.outputs.version }}
          shopt -s nullglob
          previews=(dist/Keywhere-*.dmg dist/Keywhere-*.app.zip dist/Keywhere-*-portable.exe dist/Keywhere-*-setup.exe dist/Keywhere-*.msi)
          gh release create "$GITHUB_REF_NAME" \
            "dist/Keywhere-$V-x86_64.AppImage" "dist/keywhere_${V}-1_amd64.deb" \
            "dist/keywhere-${V}-1.x86_64.rpm" "${previews[@]}" dist/latest.json dist/latest.json.minisig dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "Keywhere $V" \
            --notes-file dist/NOTES.md \
            --generate-notes \
            --latest=$latest
